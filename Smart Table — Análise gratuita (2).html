<!DOCTYPE html>
<html lang="pt-MZ" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Table — Análise gratuita</title>
<style>
:root{
  --bg:#FFFFFF;--ink:#111116;--muted:#6B6F80;--blue:#2446EE;--blue-deep:#132C9E;--blue-tint:#EEF1FE;
  --line:#E4E4EA;--card-bg:#FFFFFF;--shadow:0 16px 40px -20px rgba(17,17,22,.2);--radius:16px;--req:#C2492E;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom,0px));
  position:relative;overflow-x:hidden;}
body::before,body::after{content:"";position:fixed;width:340px;height:340px;border-radius:50%;background:var(--blue);opacity:.07;filter:blur(74px);z-index:0;pointer-events:none;}
body::before{top:-120px;right:-120px;}
body::after{bottom:-140px;left:-140px;}
.stage{width:100%;max-width:440px;position:relative;z-index:1;}
.brand{font-weight:700;font-size:.95rem;letter-spacing:-.01em;margin-bottom:14px;color:var(--blue);}
.card{position:relative;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 24px 26px;overflow:hidden;}
.footer-tag{text-align:center;font-size:.76rem;font-weight:700;color:var(--blue);margin-top:16px;letter-spacing:.02em;
  animation:glow 2.6s ease-in-out infinite;}
@keyframes glow{0%,100%{text-shadow:0 0 6px rgba(36,70,238,.18);opacity:.8;}50%{text-shadow:0 0 16px rgba(36,70,238,.55);opacity:1;}}
.ticketrow{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);}
.stages{display:flex;align-items:center;margin:0 0 16px;}
.stage-dot{width:25px;height:25px;border-radius:50%;background:var(--line);color:var(--muted);display:flex;align-items:center;
  justify-content:center;font-size:.76rem;flex:none;position:relative;transition:background .3s,color .3s,transform .3s;}
.stage-dot.done{background:var(--blue);color:#fff;}
.stage-dot.current{background:var(--blue);color:#fff;transform:scale(1.18);box-shadow:0 0 0 4px var(--blue-tint);}
.stage-dot.gift::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--blue);opacity:0;animation:giftGlow 2.2s ease-in-out infinite;}
@keyframes giftGlow{0%{opacity:.65;transform:scale(1);}70%{opacity:0;transform:scale(1.55);}100%{opacity:0;transform:scale(1.55);}}
.stage-line{flex:1;height:3px;background:var(--line);margin:0 4px;border-radius:2px;overflow:hidden;}
.stage-line-fill{display:block;height:100%;background:var(--blue);border-radius:2px;transition:width .5s cubic-bezier(.3,.7,.2,1);}
.kicker{font-size:.76rem;font-weight:600;color:var(--blue);margin:14px 0 6px;letter-spacing:.02em;}
h1{font-size:1.34rem;line-height:1.3;margin:0 0 10px;font-weight:700;letter-spacing:-.01em;}
h1 mark{background:var(--blue-tint);color:var(--blue-deep);padding:1px 7px;border-radius:7px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
h1.h1-big{font-size:1.6rem;line-height:1.26;margin:2px 0 16px;text-align:center;}
.sub{color:var(--muted);font-size:.95rem;line-height:1.55;margin:0 0 18px;}
.field{margin-bottom:3px;}
.field label{display:flex;align-items:center;gap:6px;font-size:.86rem;margin-bottom:7px;color:var(--muted);}
.req-tag{color:#fff;background:var(--req);font-size:.66rem;font-weight:700;padding:3px 8px;border-radius:6px;}
.opt-tag{color:var(--muted);font-size:.66rem;font-weight:600;background:var(--line);padding:3px 8px;border-radius:6px;}
.field-wrap{position:relative;}
.field-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--blue);display:flex;}
.field-wrap .ic svg{width:18px;height:18px;display:block;}
input[type=text],input[type=tel],input[type=email]{width:100%;padding:13px 15px 13px 40px;border-radius:13px;border:1.6px solid var(--line);
  background:#FAFAFD;color:var(--ink);font-size:1rem;margin-bottom:14px;font-family:inherit;transition:border-color .15s,background .15s;}
input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--blue-tint);}
.btn{display:block;width:100%;padding:16px 18px;border-radius:14px;border:none;font-size:.97rem;font-weight:600;cursor:pointer;text-align:center;
  text-decoration:none;font-family:inherit;transition:transform .12s ease,box-shadow .15s;}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 12px 26px -10px rgba(36,70,238,.55);
  animation:pop .4s cubic-bezier(.2,.9,.3,1.3) both;}
.btn-primary:active{transform:scale(.97);background:var(--blue-deep);box-shadow:0 6px 16px -8px rgba(36,70,238,.5);}
.btn-ghost{background:none;border:none;color:var(--muted);font-size:.84rem;cursor:pointer;padding:0;margin-bottom:14px;
  display:inline-flex;align-items:center;gap:5px;font-family:inherit;}
.addmore{background:none;border:1.6px dashed var(--line);color:var(--blue);font-weight:600;font-size:.84rem;padding:12px;
  border-radius:13px;width:100%;cursor:pointer;margin-bottom:14px;font-family:inherit;}
.choices{display:flex;flex-direction:column;gap:9px;margin-bottom:4px;}
.choice{display:flex;align-items:center;gap:10px;text-align:left;padding:14px 16px;border-radius:14px;border:1.6px solid var(--line);
  background:transparent;color:var(--ink);font-size:.93rem;font-weight:600;cursor:pointer;font-family:inherit;
  transition:border-color .15s,background .15s,transform .1s;}
.choice:active{transform:scale(.98);}
.choice .ic{font-size:1.1rem;}
.choice.sel{border-color:var(--blue);background:var(--blue-tint);}
.choice.feat{background:var(--blue);color:#fff;border-color:var(--blue);}
.choice .check{margin-left:auto;color:var(--blue);font-weight:700;opacity:0;}
.choice.sel .check{opacity:1;}
.choice.feat .check{color:#fff;}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px;}
.chip{padding:14px 10px;border-radius:14px;border:1.6px solid var(--line);text-align:center;font-size:.87rem;font-weight:600;cursor:pointer;
  font-family:inherit;color:var(--ink);background:transparent;transition:border-color .15s,background .15s,transform .1s;}
.chip:active{transform:scale(.97);}
.chip .ic{display:block;font-size:1.3rem;margin-bottom:4px;}
.chip.sel{border-color:var(--blue);background:var(--blue-tint);}
.factrow{display:flex;gap:10px;margin-bottom:14px;}
.fact{flex:1;background:var(--blue-tint);border-radius:12px;padding:12px;display:flex;align-items:center;gap:9px;}
.fact .fic{font-size:1.3rem;}
.fact strong{display:block;font-size:1.02rem;color:var(--ink);}
.fact small{color:var(--muted);font-size:.7rem;}
.calcline{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--ink);padding:4px 0;}
.calcline .hl{color:var(--blue);font-weight:700;}
.formula{font-size:.78rem;color:var(--muted);margin:1px 0 12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.slider-wrap{margin:4px 0 14px;padding:12px 14px 10px;background:#FAFAFD;border:1.4px solid var(--line);border-radius:13px;}
.slider-label{display:flex;justify-content:space-between;align-items:center;font-size:.84rem;color:var(--ink);font-weight:600;margin-bottom:8px;}
.slider-label span{color:var(--blue);font-weight:800;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:var(--line);outline:none;margin:4px 0 0;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--blue);
  border:3px solid #fff;box-shadow:0 2px 10px rgba(36,70,238,.5);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--blue);border:3px solid #fff;
  box-shadow:0 2px 10px rgba(36,70,238,.5);cursor:pointer;border:none;}
.calcresult{text-align:center;font-size:1.5rem;font-weight:800;color:var(--blue);margin:8px 0 6px;padding-top:12px;border-top:1px dashed var(--line);}
.calcresult .calcresult-label{display:block;font-size:.76rem;font-weight:500;color:var(--muted);margin-top:4px;}
.insight-note{background:var(--blue-tint);border-radius:12px;padding:13px 14px;font-size:.85rem;line-height:1.55;color:var(--ink);margin:14px 0 4px;}
.chart{width:100%;height:auto;margin:4px 0 18px;display:block;}
.chart polyline{stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.1s .25s ease forwards;}
.chart circle{opacity:0;animation:dot .3s 1.35s ease forwards;}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes dot{to{opacity:1}}
.note{font-size:.81rem;color:var(--muted);text-align:center;margin-top:14px;}
.enter>*{animation:rise .36s cubic-bezier(.22,.85,.3,1.15) both;}
.enter>*:nth-child(1){animation-delay:.02s}.enter>*:nth-child(2){animation-delay:.06s}
.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.14s}
.enter>*:nth-child(5){animation-delay:.18s}.enter>*:nth-child(6){animation-delay:.22s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.progress>div{transition:none;}.enter>*,.btn-primary,.chart polyline,.chart circle,.procline,.procbar>div,.reveal,.footer-tag,.stage-dot.gift::after{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;}}

.vsl-wrap{display:flex;justify-content:center;}
.vsl{position:relative;border-radius:18px;overflow:hidden;margin:0 0 20px;width:210px;aspect-ratio:9/16;flex:none;
  background:repeating-linear-gradient(115deg,#0B0D18,#0B0D18 10px,#141A33 10px,#141A33 20px);
  display:flex;align-items:center;justify-content:center;}
.vsl-play{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.05rem;border:1.5px solid rgba(255,255,255,.35);}
.vsl-scrub{position:absolute;left:13px;right:13px;bottom:13px;height:3px;border-radius:2px;background:rgba(255,255,255,.25);}
.vsl-scrub>div{width:26%;height:100%;background:var(--blue);border-radius:2px;}

.img-illustration{border-radius:16px;overflow:hidden;margin:2px 0 20px;background:#EEF1FE;}
.img-illustration svg{display:block;width:100%;height:auto;}

.recap{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 20px;}
.recap-pill{background:var(--blue-tint);color:var(--blue-deep);font-size:.78rem;font-weight:600;padding:7px 12px;border-radius:999px;}

.pillars{display:flex;justify-content:space-between;gap:8px;margin:18px 0 6px;}
.pillar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.pillar .pic{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;flex:none;}
.pillar span:last-child{font-size:.7rem;font-weight:600;color:var(--ink);line-height:1.3;}

.proofrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.proof{display:inline-flex;align-items:center;gap:6px;font-size:.77rem;color:var(--muted);background:transparent;
  border:1px solid var(--line);padding:6px 11px;border-radius:999px;}
.quote{border-left:3px solid var(--blue);padding:2px 0 2px 14px;margin:0 0 20px;font-size:.88rem;color:var(--ink);font-style:italic;}
.quote cite{display:block;font-style:normal;font-size:.78rem;color:var(--muted);margin-top:6px;}
.successmark{display:block;margin:4px auto 18px;width:64px;height:64px;}
.successmark circle{stroke-dasharray:151;stroke-dashoffset:151;animation:circ .55s ease forwards;}
.successmark path{stroke-dasharray:40;stroke-dashoffset:40;animation:tick .35s .45s ease forwards;}
@keyframes circ{to{stroke-dashoffset:0}}
@keyframes tick{to{stroke-dashoffset:0}}

.reveal{background:var(--blue);color:#fff;border-radius:16px;padding:18px 18px 16px;margin:6px 0 18px;
  box-shadow:0 14px 30px -14px rgba(36,70,238,.55);animation:pop .35s cubic-bezier(.2,.9,.3,1.3) both;}
.reveal .tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.02em;background:rgba(255,255,255,.2);
  padding:4px 10px;border-radius:999px;margin-bottom:10px;}
.reveal p{margin:0;font-size:.92rem;line-height:1.55;}
.proc{margin:10px 0 18px;}
.procline{display:flex;align-items:center;gap:10px;padding:8px 0;color:var(--muted);font-size:.89rem;opacity:0;animation:procIn .4s ease forwards;}
.procdot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none;}
@keyframes procIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.procbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px;}
.procbar>div{height:100%;width:34%;background:var(--blue);border-radius:2px;animation:procSlide 1.7s ease-in-out infinite;}
@keyframes procSlide{0%{transform:translateX(-110%)}100%{transform:translateX(400%)}}
.counter{text-align:center;margin:6px 0 14px;}
.counter-num{font-size:2.5rem;font-weight:800;color:var(--blue);line-height:1;}
.counter-label{font-size:.79rem;color:var(--muted);margin-top:4px;}
.insights{list-style:none;padding:0;margin:0 0 8px;display:flex;flex-direction:column;gap:9px;}
.insights li{background:var(--blue-tint);border-radius:12px;padding:12px 14px 12px 34px;font-size:.87rem;line-height:1.5;color:var(--ink);position:relative;}
.insights li::before{content:"✓";position:absolute;left:14px;top:12px;color:var(--blue);font-weight:700;}
</style>
</head>

  cta:'Sim, quero fazer parte'},
 {type:'result',title:'Análise concluída',sub:'Com base nas tuas respostas, encontrámos a solução ideal para {nome} elevar o faturamento.',cta:'Obter a solução'},
 {type:'hero',video:true,title:'Esta tecnologia já está a <mark>elevar o faturamento</mark> de vários restaurantes',cta:'Obter a Smart Table'},
 {type:'contact',kicker:'Último passo',title:'Está na hora de impulsionar os resultados de {nome}',
  sub:'Confirma os teus dados para receberes a solução, sem qualquer custo adicional. Só o contacto do restaurante é opcional.',final:true,cta:'Quero receber a solução'},
 {type:'thanks',title:'Os teus dados foram entregues',sub:'A nossa equipa vai entrar em contacto em breve pelo WhatsApp para te entregar a solução de {nome}.'}
];
const WHATSAPP_NUMBER="258840000000"; // TODO: substitui pelo número real da equipa Smart Table
let cur=0;const ans={};const quizSel={};let contactExpanded=false;let resultPhase=1;let resultTimer=null;
function nomeTxt(){return (ans.nome&&ans.nome.trim())?ans.nome.trim():'o teu restaurante';}
function fill(s){return s.replace(/\{nome\}/g,nomeTxt());}
function fmtN(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function waLink(){
  const t=`Olá! Vim do funil da Smart Table.\nRestaurante: ${ans.nome||'-'}\nTipo: ${ans.tipo||'-'}\nLocalização: ${ans.local||'-'}\nContacto do restaurante: ${ans.contactoEmpresa||'-'}\nFaturação mensal: ${ans.faturacao||'-'}\nMesas: ${ans.mesas||'-'}\nObjetivo: ${ans.solucao||'-'}\nContacto: ${ans.resp_nome||'-'} (${ans.cargo||'-'})\nWhatsApp: ${ans.whatsapp||'-'}\nTelefone: ${ans.telefone||'-'}`;
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(t)}`;
}
function chartSVG(){
  return `<svg class="chart" viewBox="0 0 380 150" xmlns="http://www.w3.org/2000/svg">
  <polyline points="10,120 100,96 190,100 280,46 370,30" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="370" cy="30" r="5.5" fill="var(--blue)"/>
  <text x="10" y="140" font-size="11" fill="var(--muted)" font-family="inherit">Antes</text>
  <text x="340" y="22" font-size="11" fill="var(--muted)" font-family="inherit">Depois</text>
  </svg>`;
}
function vslHTML(){return `<div class="vsl-wrap"><div class="vsl"><div class="vsl-play">▶</div><div class="vsl-scrub"><div></div></div></div></div>`;}
function imgSlotHTML(){
  return `<div class="img-illustration"><svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" rx="20" fill="#EEF1FE"/>
  <circle cx="60" cy="40" r="26" fill="#2446EE" opacity="0.08"/>
  <circle cx="350" cy="212" r="34" fill="#2446EE" opacity="0.08"/>
  <rect x="120" y="55" width="180" height="140" rx="16" fill="#111827"/>
  <rect x="134" y="69" width="152" height="112" rx="8" fill="#FFFFFF"/>
  <rect x="150" y="140" width="16" height="30" rx="3" fill="#2446EE" opacity="0.35"/>
  <rect x="175" y="120" width="16" height="50" rx="3" fill="#2446EE" opacity="0.55"/>
  <rect x="200" y="100" width="16" height="70" rx="3" fill="#2446EE" opacity="0.75"/>
  <rect x="225" y="80" width="16" height="90" rx="3" fill="#2446EE"/>
  <polyline points="150,150 175,130 200,108 225,85 250,78" fill="none" stroke="#2446EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="250" cy="78" r="5" fill="#2446EE"/>
  <g transform="translate(52,148)"><rect x="0" y="10" width="38" height="30" rx="6" fill="#FFFFFF" stroke="#2446EE" stroke-width="2.5"/><path d="M38 16h8a8 8 0 0 1 0 16h-8" fill="none" stroke="#2446EE" stroke-width="2.5"/><path d="M4 10c0-6 30-6 30 0" fill="none" stroke="#2446EE" stroke-width="2.5"/></g>
  <g transform="translate(302,36)"><circle cx="20" cy="20" r="20" fill="#FFFFFF" stroke="#2446EE" stroke-width="2.5"/><circle cx="20" cy="20" r="10" fill="none" stroke="#2446EE" stroke-width="2"/></g>
  </svg></div>`;
}
function recapHTML(){
  const items=[];
  if(ans.tipo)items.push('🍽️ '+ans.tipo);
  if(ans.local)items.push('📍 '+ans.local);
  if(ans.faturacao)items.push('💰 '+ans.faturacao);
  if(ans.mesas)items.push('🪑 '+ans.mesas);
  return items.length?`<div class="recap">${items.map(i=>`<span class="recap-pill">${i}</span>`).join('')}</div>`:'';
}
function coversForMesas(m){
  if(!m)return 60;
  if(m.indexOf('1–5')===0)return 40;
  if(m.indexOf('5–10')===0)return 80;
  if(m.indexOf('10–25')===0)return 150;
  return 280;
}
const CALC_BASE=450;
function updateCalc(v){
  v=parseInt(v,10);
  const covers=coversForMesas(ans.mesas);
  const dailyBase=CALC_BASE*covers;
  const newTicket=Math.round(CALC_BASE*(1+v/100));
  const dailyNew=newTicket*covers;
  const extraMonth=(dailyNew-dailyBase)*30;
  document.getElementById('calcSliderPct').textContent='+'+v+'%';
  document.getElementById('calcNewTicket').textContent=newTicket+' MZN';
  document.getElementById('calcNewFormula').textContent=newTicket+' MZN × '+covers+' clientes/dia';
  document.getElementById('calcGain').textContent='+'+fmtN(extraMonth)+' MZN';
}
function calcHTML(){
  const covers=coversForMesas(ans.mesas);const pct=15;
  const dailyBase=CALC_BASE*covers;
  const newTicket=Math.round(CALC_BASE*(1+pct/100));
  const dailyNew=newTicket*covers;
  const extraMonth=(dailyNew-dailyBase)*30;
  return `<div class="factrow">
    <div class="fact"><span class="fic">👥</span><div><strong>${covers}</strong><small>clientes/dia (exemplo)</small></div></div>
    <div class="fact"><span class="fic">💵</span><div><strong>${CALC_BASE} MZN</strong><small>ticket médio atual</small></div></div>
  </div>
  <div class="calcline"><span>Faturamento diário atual</span><strong>${fmtN(dailyBase)} MZN</strong></div>
  <p class="formula">${CALC_BASE} MZN × ${covers} clientes/dia</p>
  <div class="slider-wrap">
    <div class="slider-label">Aumenta o ticket médio <span id="calcSliderPct">+${pct}%</span></div>
    <input type="range" min="0" max="30" step="5" value="${pct}" oninput="updateCalc(this.value)">
  </div>
  <div class="calcline"><span>Novo ticket médio</span><strong class="hl" id="calcNewTicket">${newTicket} MZN</strong></div>
  <p class="formula" id="calcNewFormula">${newTicket} MZN × ${covers} clientes/dia</p>
  <div class="calcresult"><span id="calcGain">+${fmtN(extraMonth)} MZN</span><span class="calcresult-label">a mais por mês, em exemplo, para ${nomeTxt()}</span></div>
  <div class="insight-note">💡 Com o mesmo número de clientes, só o aumento do ticket médio já faz o faturamento crescer — sem gastares dinheiro a atrair novos clientes ou a abrir mais mesas. Basta fazer cada cliente consumir um pouco mais.</div>
  <p class="note" style="margin:10px 0 18px;">*Exemplo ilustrativo com base em restaurantes com um número de mesas semelhante ao teu.</p>`;
}
function stagesHTML(){
  let h='<div class="stages">';
  STAGES.forEach((st,idx)=>{
    if(idx>0){
      const prev=STAGES[idx-1];
      const f=cur>=prev.upTo?1:(cur<=prev.from?0:(cur-prev.from)/(prev.upTo-prev.from));
      h+=`<div class="stage-line"><div class="stage-line-fill" style="width:${Math.round(f*100)}%"></div></div>`;
    }
    const cls=['stage-dot'];
    if(cur>st.upTo)cls.push('done');
    else if(cur>=st.from&&cur<=st.upTo)cls.push('current');
    if(idx===STAGES.length-1)cls.push('gift');
    h+=`<div class="${cls.join(' ')}">${st.icon}</div>`;
  });
  return h+'</div>';
}
function barHTML(){
  const total=STEPS.length-1;const pct=Math.min(100,Math.round((cur/total)*100));
  return `<div class="ticketrow"><span>Passo ${Math.min(cur+1,total)} de ${total}</span><span>${pct}%</span></div>${stagesHTML()}`;
}
function backBtn(){return cur>0&&cur<STEPS.length-1?`<button class="btn-ghost" onclick="go(${cur-1})">← Voltar</button>`:'';}
function fieldHTML(f,isOptional){
  return `<div class="field"><label>${f.label} ${isOptional?'<span class="opt-tag">opcional</span>':'<span class="req-tag">obrigatório</span>'}</label>
  <div class="field-wrap"><span class="ic">${f.ic}</span><input id="c_${f.key}" type="${f.itype}" placeholder="${f.ph}" value="${ans[f.key]||''}"></div></div>`;
}
function contactFieldsHTML(expanded,final){
  const isOpt=f=>final?(f.key==='contactoEmpresa'):!!f.optional;
  const req=CONTACT_FIELDS.filter(f=>!isOpt(f));
  const opt=CONTACT_FIELDS.filter(f=>isOpt(f));
  let h=req.map(f=>fieldHTML(f,false)).join('');
  if(final){h+=opt.map(f=>fieldHTML(f,true)).join('');}
  else if(expanded){h+=opt.map(f=>fieldHTML(f,true)).join('');}
  else{h+=`<button type="button" class="addmore" onclick="toggleExpand()">+ Adicionar mais detalhes (opcional)</button>`;}
  return h;
}
function buildInsights(){
  const arr=[];
  if(ans.solucao)arr.push(`O teu foco em "${ans.solucao.toLowerCase()}" é exatamente onde a Smart Table tem mais impacto.`);
  if(ans.estado==='Mau, estou quase a fechar')arr.push('Identificámos sinais de que pequenas mudanças podem ter um impacto rápido no teu caixa.');
  else if(ans.estado==='Oscila, às vezes é negativo')arr.push('A tua faturação oscila — estabilizar o ticket médio é o primeiro passo para mais previsibilidade.');
  else if(ans.estado)arr.push('Já tens uma base estável — isso significa que o crescimento agora pode ser ainda mais rápido.');
  if(ans.mesas)arr.push(`Com ${ans.mesas.toLowerCase()}, há espaço real para aumentar o valor de cada pedido sem precisares de mais espaço físico.`);
  return arr.slice(0,3);
}
function processingHTML(){
  const lines=['A processar os dados de '+nomeTxt()+'...','A comparar com restaurantes semelhantes...','A calcular o potencial de crescimento...','A preparar a tua solução...'];
  return `<h1>A analisar o teu negócio...</h1><div class="proc">${lines.map((l,i)=>`<div class="procline" style="animation-delay:${.15+i*.4}s"><span class="procdot"></span>${l}</div>`).join('')}<div class="procbar"><div></div></div></div>`;
}
function resultRevealHTML(s){
  const insights=buildInsights();
  return fill(`<h1>${s.title}</h1><p class="sub">${s.sub}</p>
  <div class="counter"><div class="counter-num"><span id="cnum">0</span>%</div><div class="counter-label">potencial estimado de aumento no ticket médio*</div></div>
  ${chartSVG()}
  ${insights.length?'<ul class="insights">'+insights.map(i=>`<li>${i}</li>`).join('')+'</ul>':''}
  <p class="note" style="margin-bottom:16px;">*Estimativa com base em restaurantes semelhantes.</p>
  <button class="btn btn-primary" onclick="go(${cur+1})">${s.cta}</button>`);
}
function animateCounter(){
  const el=document.getElementById('cnum');if(!el)return;
  const target=22;const dur=900;const start=performance.now();
  function step(t){const p=Math.min(1,(t-start)/dur);el.textContent=Math.round(p*target);if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}
function render(){
  const s=STEPS[cur];const el=document.getElementById('card');let h='';
  if(s.type!=='thanks'&&!s.video)h+=barHTML();
  if(!s.video)h+=backBtn();
  if(s.kicker&&!s.video)h+=`<div class="kicker">${fill(s.kicker)}</div>`;
  if(s.type==='hero'){
    if(s.video){
      h+=`<h1 class="h1-big">${fill(s.title)}</h1>`;
      h+=vslHTML();
      h+=`<button class="btn btn-primary" onclick="go(${cur+1})">${s.cta}</button>`;
    }else{
      h+=`<h1>${fill(s.title)}</h1>`;
      if(s.img)h+=imgSlotHTML();
      if(s.recap)h+=recapHTML();
      if(s.pillars)h+=`<div class="pillars">${s.pillars.map(p=>`<div class="pillar"><span class="pic">${p.i}</span><span>${p.t}</span></div>`).join('')}</div>`;
      h+=`<p class="sub">${fill(s.sub)}</p>`;
      if(s.proof)h+=`<div class="proofrow">${s.proof.map(p=>`<span class="proof">${p}</span>`).join('')}</div>`;
      if(s.quote)h+=`<blockquote class="quote">${s.quote.t}<cite>${s.quote.cite}</cite></blockquote>`;
      h+=`<button class="btn btn-primary" onclick="go(${cur+1})">${s.cta}</button>`;
    }
  }else if(s.type==='input'){
    h+=`<h1>${fill(s.label)}</h1>
    <div class="field"><input id="inp" type="${s.itype}" placeholder="${s.ph}" value="${ans[s.key]||''}" style="padding-left:15px;"></div>
    <button class="btn btn-primary" onclick="submitInput('${s.key}')">Continuar</button>`;
  }else if(s.type==='choice'||s.type==='chips'){
    h+=`<h1>${fill(s.label)}</h1><div class="${s.type==='choice'?'choices':'chips'}">`;
    s.options.forEach((o,idx)=>{
      const sel=ans[s.key]===o?' sel':'';const ic=s.icons?s.icons[idx]:'';
      if(s.type==='choice'){
        const feat=(s.featuredOption===o&&ans[s.key]!==o)?' feat':'';
        h+=`<button class="choice${sel}${feat}" onclick="pick('${s.key}',\`${o}\`)">${ic?'<span class="ic">'+ic+'</span>':''}<span>${o}</span><span class="check">✓</span></button>`;
      }else{
        h+=`<button class="chip${sel}" onclick="pick('${s.key}',\`${o}\`)">${ic?'<span class="ic">'+ic+'</span>':''}${o}</button>`;
      }});
    h+=`</div>`;
  }else if(s.type==='quiz'){
    h+=`<h1>${fill(s.title)}</h1><div class="choices">`;
    s.options.forEach((o,idx)=>{const sel=quizSel[cur]===o?' sel':'';const feat=(s.featuredOption===o&&quizSel[cur]!==o)?' feat':'';const ic=s.icons?s.icons[idx]:'';
      h+=`<button class="choice${sel}${feat}" onclick="quizPick(${cur},\`${o}\`)">${ic?'<span class="ic">'+ic+'</span>':''}<span>${o}</span></button>`;});
    h+=`</div>`;
    if(quizSel[cur])h+=`<div class="reveal"><span class="tag">💡 Já sabes</span><p>${fill(s.reveal)}</p></div><button class="btn btn-primary" onclick="go(${cur+1})">Continuar</button>`;
  }else if(s.type==='calc'){
    h+=`<h1>${fill(s.title)}</h1><p class="sub">${fill(s.sub)}</p>${calcHTML()}<button class="btn btn-primary" onclick="go(${cur+1})">${s.cta}</button>`;
  }else if(s.type==='result'){
    h+= resultPhase===1?processingHTML():resultRevealHTML(s);
  }else if(s.type==='contact'){
    const expanded=s.final||contactExpanded||CONTACT_FIELDS.some(f=>f.optional&&ans[f.key]);
    h+=`<h1>${fill(s.title)}</h1><p class="sub">${fill(s.sub)}</p>`;
    if(s.proof)h+=`<div class="proofrow">${s.proof.map(p=>`<span class="proof">${p}</span>`).join('')}</div>`;
    h+=`${contactFieldsHTML(expanded,s.final)}
    <button class="btn btn-primary" onclick="submitContact(${s.final})">${s.cta||'Continuar'}</button>
    ${s.final?'<p class="note">🔒 Os teus dados servem apenas para a equipa Smart Table entrar em contacto contigo.</p>':''}`;
  }else if(s.type==='thanks'){
    h+=`<svg class="successmark" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="none" stroke="var(--blue)" stroke-width="2.5"/><path fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M14 27l7 7 17-17"/></svg>
    <h1>${fill(s.title)}</h1><p class="sub">${fill(s.sub)}</p>
    <div class="reveal"><span class="tag">⚡ Queres acelerar?</span><p>Não fiques na lista de espera — fala agora diretamente com a nossa equipa e ganha prioridade na resposta.</p></div>
    <a class="btn btn-primary" href="${waLink()}" target="_blank" rel="noopener">Falar agora pelo WhatsApp</a>
    <p class="note">Podes fechar esta janela a qualquer momento — entraremos em contacto de qualquer forma.</p>`;
  }
  el.innerHTML=h;el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter');
  const inp=document.getElementById('inp');
  if(inp){inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')submitInput(s.key);};}
  if(s.type==='contact'){const f=document.getElementById('c_resp_nome');if(f)f.focus();}
  if(s.type==='result'){
    if(resultPhase===1){if(resultTimer)clearTimeout(resultTimer);resultTimer=setTimeout(()=>{resultPhase=2;render();},2050);}
    else animateCounter();
  }
}
function go(i){
  if(STEPS[i].type==='contact')contactExpanded=false;
  if(STEPS[i].type==='result'){resultPhase=1;if(resultTimer)clearTimeout(resultTimer);}
  cur=i;render();
}
function pick(key,val){ans[key]=val;render();setTimeout(()=>go(cur+1),320);}
function quizPick(i,val){quizSel[i]=val;render();}
function toggleExpand(){contactExpanded=true;render();}
function submitInput(key){
  const v=document.getElementById('inp').value.trim();
  if(!v){document.getElementById('inp').style.borderColor='#C2492E';return;}
  ans[key]=v;go(cur+1);
}
function submitContact(final){
  let ok=true;
  CONTACT_FIELDS.forEach(f=>{
    const fel=document.getElementById('c_'+f.key);if(!fel)return;
    const v=fel.value.trim();ans[f.key]=v;fel.style.borderColor='';
    const isOptional=final?(f.key==='contactoEmpresa'):!!f.optional;
    if(!isOptional&&!v){fel.style.borderColor='#C2492E';ok=false;}
  });
  if(!ok)return;
  if(!ans.telefone&&ans.whatsapp)ans.telefone=ans.whatsapp;
  go(cur+1);
  if(final)setTimeout(()=>window.open(waLink(),'_blank'),250);
}
render();
</script>
</body>
</html>
