<!DOCTYPE html>
<html lang="pt-MZ" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Table — Análise gratuita</title>
<style>
:root{
  --bg:#FFFFFF;--ink:#111116;--muted:#6B6F80;--blue:#2446EE;--blue-deep:#132C9E;--blue-tint:#EEF1FE;
  --line:#E4E4EA;--card-bg:#FFFFFF;--shadow:0 16px 40px -20px rgba(17,17,22,.2);--radius:16px;--req:#C2492E;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom,0px));
  position:relative;overflow-x:hidden;}
body::before,body::after{content:"";position:fixed;width:340px;height:340px;border-radius:50%;background:var(--blue);opacity:.07;filter:blur(74px);z-index:0;pointer-events:none;}
body::before{top:-120px;right:-120px;}
body::after{bottom:-140px;left:-140px;}
.stage{width:100%;max-width:440px;position:relative;z-index:1;}
.brand{font-weight:700;font-size:.95rem;letter-spacing:-.01em;margin-bottom:14px;color:var(--blue);}
.card{position:relative;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 24px 26px;overflow:hidden;}
.footer-tag{text-align:center;font-size:.76rem;font-weight:700;color:var(--blue);margin-top:16px;letter-spacing:.02em;
  animation:glow 2.6s ease-in-out infinite;}
@keyframes glow{0%,100%{text-shadow:0 0 6px rgba(36,70,238,.18);opacity:.8;}50%{text-shadow:0 0 16px rgba(36,70,238,.55);opacity:1;}}
.ticketrow{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);}
.stages{display:flex;align-items:center;margin:0 0 16px;}
.stage-dot{width:25px;height:25px;border-radius:50%;background:var(--line);color:var(--muted);display:flex;align-items:center;
  justify-content:center;font-size:.76rem;flex:none;position:relative;transition:background .3s,color .3s,transform .3s;}
.stage-dot.done{background:var(--blue);color:#fff;}
.stage-dot.current{background:var(--blue);color:#fff;transform:scale(1.18);box-shadow:0 0 0 4px var(--blue-tint);}
.stage-dot.gift::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--blue);opacity:0;animation:giftGlow 2.2s ease-in-out infinite;}
@keyframes giftGlow{0%{opacity:.65;transform:scale(1);}70%{opacity:0;transform:scale(1.55);}100%{opacity:0;transform:scale(1.55);}}
.stage-line{flex:1;height:3px;background:var(--line);margin:0 4px;border-radius:2px;overflow:hidden;}
.stage-line-fill{display:block;height:100%;background:var(--blue);border-radius:2px;transition:width .5s cubic-bezier(.3,.7,.2,1);}
.kicker{font-size:.76rem;font-weight:600;color:var(--blue);margin:14px 0 6px;letter-spacing:.02em;}
h1{font-size:1.34rem;line-height:1.3;margin:0 0 10px;font-weight:700;letter-spacing:-.01em;}
h1 mark{background:var(--blue-tint);color:var(--blue-deep);padding:1px 7px;border-radius:7px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
h1.h1-big{font-size:1.6rem;line-height:1.26;margin:2px 0 16px;text-align:center;}
.sub{color:var(--muted);font-size:.95rem;line-height:1.55;margin:0 0 18px;}
.field{margin-bottom:3px;}
.field label{display:flex;align-items:center;gap:6px;font-size:.86rem;margin-bottom:7px;color:var(--muted);}
.req-tag{color:#fff;background:var(--req);font-size:.66rem;font-weight:700;padding:3px 8px;border-radius:6px;}
.opt-tag{color:var(--muted);font-size:.66rem;font-weight:600;background:var(--line);padding:3px 8px;border-radius:6px;}
.field-wrap{position:relative;}
.field-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--blue);display:flex;}
.field-wrap .ic svg{width:18px;height:18px;display:block;}
input[type=text],input[type=tel],input[type=email]{width:100%;padding:13px 15px 13px 40px;border-radius:13px;border:1.6px solid var(--line);
  background:#FAFAFD;color:var(--ink);font-size:1rem;margin-bottom:14px;font-family:inherit;transition:border-color .15s,background .15s;}
input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--blue-tint);}
.btn{display:block;width:100%;padding:16px 18px;border-radius:14px;border:none;font-size:.97rem;font-weight:600;cursor:pointer;text-align:center;
  text-decoration:none;font-family:inherit;transition:transform .12s ease,box-shadow .15s;}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 12px 26px -10px rgba(36,70,238,.55);
  animation:pop .4s cubic-bezier(.2,.9,.3,1.3) both;}
.btn-primary:active{transform:scale(.97);background:var(--blue-deep);box-shadow:0 6px 16px -8px rgba(36,70,238,.5);}
.btn-ghost{background:none;border:none;color:var(--muted);font-size:.84rem;cursor:pointer;padding:0;margin-bottom:14px;
  display:inline-flex;align-items:center;gap:5px;font-family:inherit;}
